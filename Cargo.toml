[package]
name = "bawkseek"
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
description = "Soulseek client and audio player"
publish = false

[workspace]
members = ["crates/slsk"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
gpui-kit = "0.7.1"
igd-next = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
log = "0.4.34"
slsk = { path = "crates/slsk" }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav", "symphonia-alac", "symphonia-aiff"] }
lofty = "0.25.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
ureq = { version = "3", features = ["json"] }
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.31"

[package.metadata.deb]
maintainer = "juddisjudd <juddisjudd@users.noreply.github.com>"
copyright = "2026, juddisjudd"
license-file = ["LICENSE", "0"]
section = "net"
extended-description = "Search, download and share music on the Soulseek network, chat, and play your library in the built-in player."
depends = "$auto, libvulkan1"
recommends = "gnome-keyring"
assets = [
    ["target/release/bawkseek", "usr/bin/", "755"],
    ["packaging/linux/bawkseek.desktop", "usr/share/applications/", "644"],
    ["assets/brand/bawkseek.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/bawkseek", dest = "/usr/bin/bawkseek", mode = "755" },
    { source = "packaging/linux/bawkseek.desktop", dest = "/usr/share/applications/bawkseek.desktop", mode = "644" },
    { source = "assets/brand/bawkseek.png", dest = "/usr/share/icons/hicolor/256x256/apps/bawkseek.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/bawkseek/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
"libvulkan.so.1()(64bit)" = "*"
