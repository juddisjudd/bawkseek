[package]
name = "slsk"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
description = "The Soulseek protocol, for bawkseek"
publish = false

[dependencies]
flate2 = "1.1.10"
lofty = "0.25.4"
log = "0.4.34"
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "fs", "macros"] }

[dev-dependencies]
env_logger = "0.11.11"
tokio = { version = "1.53.2", features = ["test-util", "macros", "rt"] }
